name: 田中貴金属 金監視

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリ取得
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要ライブラリをインストール
        run: |
          pip install requests beautifulsoup4

      - name: 金価格を監視
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python monitor.py

      - name: state.jsonを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "価格監視状態を更新"
          git push
